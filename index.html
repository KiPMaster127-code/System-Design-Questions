<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Computer Device Survey</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Computer Device Survey</h1>
        <form id="surveyForm">

            <label>1. How long have you been using the current computer device ? </label>
            <select name="usage_time" required>
                <option value="">Select...</option>
                <option>Less than 6 months</option>
                <option>6 months – 1 year</option>
                <option>1 – 3 years</option>
                <option>More than 3 years</option>
            </select>

            <label>2. How frequently does your computer experience issues that effects your work ?</label>
            <select name="downtime" required>
                <option value="">Select...</option>
                <option>Daily</option>
                <option>Weekly</option>
                <option>Monthly</option>
                <option>Rarely</option>
            </select>

            <label>3. Who do you use to perform repairs of your computer device ? </label>
            <textarea name="repairs" required placeholder="Describe"></textarea>

            <label>4. Have you ever recommended to upgrade of your already used system ?</label>
            <div class="radio-group">
                <label><input type="radio" name="suggested" value="Yes" required> Yes</label>
                <label><input type="radio" name="suggested" value="No"> No</label>
            </div>

            <label>5. If yes, describe an improvement you suggested that were/not implemented ?</label>
            <textarea name="implemented" placeholder="Describe..."></textarea>

            <label>6. Which of the following devices do you currently use  ?</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="devices" value="VDT"> Video Display Terminal</label>
                <label><input type="checkbox" name="devices" value="Printer"> Printer</label>
                <label><input type="checkbox" name="devices" value="Both"> Both</label>
            </div>

            <label>7. What is your approximate typing speed in words per minute  ?</label>
            <select name="typing_speed" required>
                <option value="">Select...</option>
                <option>Under 30 WPM</option>
                <option>30–50 WPM</option>
                <option>50–70 WPM</option>
                <option>70+ WPM</option>
            </select>

            <label>8. How many employees at your branch need regular database access ?</label>
            <input type="number" name="db_access" min="0" required placeholder="Enter number">

            <label>9. Is there anyone at your branch who would like to use a computer device that they do not have  ?</label>
            <div class="radio-group">
                <label><input type="radio" name="new_users" value="Yes" required> Yes</label>
                <label><input type="radio" name="new_users" value="No"> No</label>
            </div>

            <label>11. If yes, list the name of employees who would like to use a computer system.</label>
            <textarea name="employee_names" placeholder="Enter the names"></textarea>


            <button type="submit">Submit Survey</button>
        </form>

        <p id="message" class="hidden"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
